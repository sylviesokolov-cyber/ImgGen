<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120d17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Dress Up Studio</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎀</text></svg>">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three.module.min.js",
  "three/addons/": "./vendor/"
} }
</script>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">🎀 <span>Dress Up Studio</span></div>
    <div class="actions">
      <button id="btn-random" class="icon" title="Random outfit" aria-label="Random outfit">🎲</button>
      <button id="btn-backdrop" class="icon" title="Change backdrop" aria-label="Change backdrop">🌙</button>
      <button id="btn-shot" class="icon" title="Save picture" aria-label="Save picture">📷</button>
    </div>
  </header>

  <main id="stage">
    <canvas id="view"></canvas>
    <div class="caption">
      <input id="name" maxlength="20" spellcheck="false" aria-label="Avatar name" value="My">
      <span class="caption-title">'s Avatar</span>
      <div id="count" class="count">Total (0 items)</div>
    </div>
    <div id="loading" class="loading">Loading…</div>
  </main>

  <section class="sheet">
    <nav id="tabs" class="tabs" role="tablist"></nav>
    <div id="panel" class="panel"></div>
  </section>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
